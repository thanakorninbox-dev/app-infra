---
- name: Configure WMS production server
  hosts: wms
  become: true
  vars_files:
    - vars/main.yml

  tasks:

    # ── System ────────────────────────────────────────────────────────────────
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - nginx
          - mariadb-server
          - git
          - curl
          - unzip
          - ufw
        state: present

    # ── Deploy user ───────────────────────────────────────────────────────────
    - name: Create user nok
      ansible.builtin.user:
        name: nok
        groups: sudo
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Allow nok passwordless sudo
      ansible.builtin.copy:
        content: "nok ALL=(ALL) NOPASSWD:ALL\n"
        dest: /etc/sudoers.d/nok
        mode: '0440'

    - name: Create .ssh directory for nok
      ansible.builtin.file:
        path: /home/nok/.ssh
        state: directory
        owner: nok
        group: nok
        mode: '0700'

    - name: Copy root authorized_keys to nok
      ansible.builtin.copy:
        src: /root/.ssh/authorized_keys
        dest: /home/nok/.ssh/authorized_keys
        remote_src: yes
        owner: nok
        group: nok
        mode: '0600'

    - name: Set root password
      ansible.builtin.user:
        name: root
        password: "{{ root_pass | password_hash('sha512') }}"
      no_log: true

    # ── PHP 8.3 ───────────────────────────────────────────────────────────────
    - name: Install PHP 8.3 and extensions
      ansible.builtin.apt:
        name:
          - php8.3
          - php8.3-fpm
          - php8.3-mysql
          - php8.3-mbstring
          - php8.3-xml
          - php8.3-curl
          - php8.3-zip
          - php8.3-intl
          - php8.3-bcmath
          - php8.3-gd
        state: present

    - name: Enable and start php8.3-fpm
      ansible.builtin.systemd:
        name: php8.3-fpm
        enabled: yes
        state: started

    # ── Node.js 22 ────────────────────────────────────────────────────────────
    - name: Add NodeSource Node.js 22 repo
      ansible.builtin.shell: curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Install PM2 globally
      ansible.builtin.npm:
        name: pm2
        global: yes
        state: present

    # ── MariaDB ───────────────────────────────────────────────────────────────
    - name: Enable and start MariaDB
      ansible.builtin.systemd:
        name: mariadb
        enabled: yes
        state: started

    - name: Configure MariaDB root password and create databases
      ansible.builtin.shell: |
        mysql -u root << 'EOF'
        ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_root_pass }}';
        CREATE DATABASE IF NOT EXISTS `{{ db_name }}`;
        CREATE DATABASE IF NOT EXISTS `{{ db_name2 }}`;
        FLUSH PRIVILEGES;
        EOF
      args:
        creates: /root/.my.cnf
      no_log: true

    - name: Write /root/.my.cnf so future mysql calls use root password
      ansible.builtin.copy:
        content: |
          [client]
          user=root
          password={{ db_root_pass }}
        dest: /root/.my.cnf
        mode: '0600'
      no_log: true

    # ── App deployment ────────────────────────────────────────────────────────
    - name: Ensure /var/www/html exists
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - name: Clone WMS repo
      ansible.builtin.git:
        repo: "https://{{ github_token }}@github.com/{{ github_user }}/{{ github_repo }}.git"
        dest: "{{ app_root }}"
        version: main
        force: yes
      no_log: true

    - name: Deploy app/config.php
      ansible.builtin.template:
        src: templates/app-config.php.j2
        dest: "{{ app_root }}/app/config.php"
        mode: '0640'

    - name: Deploy nodejs/.env
      ansible.builtin.template:
        src: templates/nodejs-env.j2
        dest: "{{ app_root }}/nodejs/.env"
        mode: '0640'

    - name: Install Node.js dependencies
      community.general.npm:
        path: "{{ app_root }}/nodejs"
        state: present

    - name: Set web root ownership to www-data
      ansible.builtin.file:
        path: "{{ app_root }}"
        owner: www-data
        group: www-data
        recurse: yes

    - name: Run database setup script
      ansible.builtin.command: php setup.php
      args:
        chdir: "{{ app_root }}"
      register: setup_result

    - name: Show setup output
      ansible.builtin.debug:
        var: setup_result.stdout_lines

    # ── Nginx ─────────────────────────────────────────────────────────────────
    - name: Deploy Nginx site config
      ansible.builtin.template:
        src: templates/nginx-wms.conf.j2
        dest: /etc/nginx/sites-available/wms
        mode: '0644'

    - name: Enable WMS site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/wms
        dest: /etc/nginx/sites-enabled/wms
        state: link

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    # ── PM2 ───────────────────────────────────────────────────────────────────
    - name: Configure PM2 systemd startup
      ansible.builtin.shell: env PATH=$PATH:/usr/bin pm2 startup systemd -u root --hp /root
      args:
        creates: /etc/systemd/system/pm2-root.service

    - name: Start PM2 apps
      ansible.builtin.shell: |
        cd {{ app_root }}/nodejs && pm2 start ecosystem.config.js
      ignore_errors: yes

    - name: Save PM2 process list
      ansible.builtin.command: pm2 save

    - name: Enable PM2 service on boot
      ansible.builtin.systemd:
        name: pm2-root
        enabled: yes
        daemon_reload: yes
      ignore_errors: yes

    # ── Firewall ──────────────────────────────────────────────────────────────
    - name: Allow custom SSH port
      ansible.builtin.ufw:
        rule: allow
        port: '4265'

    - name: Allow HTTP
      ansible.builtin.ufw:
        rule: allow
        port: '80'

    - name: Allow HTTPS
      ansible.builtin.ufw:
        rule: allow
        port: '443'

    - name: Allow Node.js port (Socket.io)
      ansible.builtin.ufw:
        rule: allow
        port: "{{ node_port | string }}"

    - name: Enable UFW
      ansible.builtin.ufw:
        state: enabled

    # ── SSH hardening (must be last — restarts sshd) ──────────────────────────
    - name: Set SSH port to 4265
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port\s'
        line: 'Port 4265'
        state: present

    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present

    - name: Restart SSH (fire-and-forget to avoid dropped connection)
      ansible.builtin.shell: sleep 2 && systemctl restart ssh
      async: 10
      poll: 0
